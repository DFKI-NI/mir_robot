base_global_planner: SBPLLatticePlanner
SBPLLatticePlanner:
  goal_blend_distance: 0.3   # blend the last 0.3 m of the plan from the lattice end pose into the exact goal
  environment_type: XYThetaLattice
  planner_type: ARAPlanner
  allocated_time: 10.0
  initial_epsilon: 15.0
  forward_search: false
  nominalvel_mpersecs: 0.8
  timetoturn45degsinplace_secs: 1.31 # = 0.6 rad/s
